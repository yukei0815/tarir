name: Update packages

on:
  push:
    branches: [main]
    paths: [flake.lock]
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [update/flake-lock]
  workflow_dispatch:

jobs:
  packages:
    name: Collect packages
    # A successful lock build is handled by the push once it merges
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: canidae-solutions/lix-quick-install-action@v5

      - name: Collect package to update
        id: list
        run: echo "packages=$(nix eval --json -f ci.nix packagesToUpdate)" >> "$GITHUB_OUTPUT"

  update:
    name: Update package (${{ matrix.package }})
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: canidae-solutions/lix-quick-install-action@v5

      # nix develop (used for --use-update-script) takes bashInteractive from the nixpkgs registry entry
      - name: Fetch and pin nixpkgs
        run: |
          nixpkgs=$(nix eval --raw --inputs-from . nixpkgs#path)
          echo "NIX_CONFIG=nix-path = nixpkgs=$nixpkgs" >> "$GITHUB_ENV"
          nix registry add nixpkgs "path:$nixpkgs"

      - name: Run nix-update
        id: update
        run: |
          nix shell --inputs-from . nixpkgs#lixPackageSets.lix_2_95.nix-update -c \
            nix-update --flake --use-update-script "$PACKAGE" --write-commit-message "$RUNNER_TEMP/commit-message"

          if [[ -s "$RUNNER_TEMP/commit-message" ]]; then
            echo "title=$(head -n 1 "$RUNNER_TEMP/commit-message")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/${{ matrix.package }}
          add-paths: pkgs
          author: tsubomi-kido[bot] <342627908+tsubomi-kido[bot]@users.noreply.github.com>
          committer: tsubomi-kido[bot] <342627908+tsubomi-kido[bot]@users.noreply.github.com>
          commit-message: "${{ steps.update.outputs.title || format('{0}: update', matrix.package) }}"
          title: "${{ steps.update.outputs.title || format('{0}: update', matrix.package) }}"
          body: ""
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
