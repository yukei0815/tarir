name: Update niks3

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - name: Check latest fork release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(<.github/niks3-version)
          new=$(gh release list -R yukei0815/niks3 --limit 1 --json tagName -q '.[0].tagName')
          echo "$new" > .github/niks3-version
          echo "title=niks3: $old -> $new" >> "$GITHUB_OUTPUT"
          # Don't ping or backlink
          {
            echo '````markdown'
            gh release view "${new%%-*}" -R Mic92/niks3 --json body -q .body
            echo '````'
          } > "$RUNNER_TEMP/body.md"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/niks3
          author: tsubomi-kido[bot] <342627908+tsubomi-kido[bot]@users.noreply.github.com>
          committer: tsubomi-kido[bot] <342627908+tsubomi-kido[bot]@users.noreply.github.com>
          commit-message: ${{ steps.check.outputs.title }}
          title: ${{ steps.check.outputs.title }}
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true

        # woodpecker ignores update/niks3 branch
        # auto pass the check
        # not needed but makes check green!
      - name: Pass Woodpecker check
        if: steps.pr.outputs.pull-request-head-sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=ci/woodpecker/pr/heavy -f description="Nothing to build"
