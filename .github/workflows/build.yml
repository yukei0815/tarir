name: Build
run-name: "Build: ${{ github.event.pull_request.title }}"

on: pull_request

jobs:
  plan:
    name: Plan builds
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'update/niks3'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
      - uses: canidae-solutions/lix-quick-install-action@v5
      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.yukei.moe
          skip-push: true
      - name: List jobs with packages not in cache
        id: plan
        run: |
          evals=$(nix shell --inputs-from . nixpkgs#lixPackageSets.lix_2_96.nix-eval-jobs -c \
            nix-eval-jobs --force-recurse --check-cache-status --expr '(import ./ci.nix).jobs')
          echo "jobs=$(jq -sc 'map(select(.isCached | not) | .attrPath[0]) | unique' <<< "$evals")" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.job }})
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: canidae-solutions/lix-quick-install-action@v5
        with:
          lix_conf: |
            max-jobs = 1
      - name: Download niks3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/niks3"
          curl -fsSLo "$RUNNER_TEMP/niks3.tar.gz" "https://github.com/yukei0815/niks3/releases/download/$(<.github/niks3-version)/niks3_Linux_x86_64.tar.gz"
          gh attestation verify "$RUNNER_TEMP/niks3.tar.gz" -R yukei0815/niks3
          tar xzf "$RUNNER_TEMP/niks3.tar.gz" -C "$RUNNER_TEMP/niks3"
      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.yukei.moe
          niks3-bin: ${{ runner.temp }}/niks3/niks3
      - name: Build packages not in cache
        env:
          JOB: ${{ matrix.job }}
        run: |
          nix shell --inputs-from . nixpkgs#lixPackageSets.lix_2_96.nix-fast-build -c \
            nix-fast-build --file ci.nix -A "jobs.$JOB" --skip-cached

  # for branch protection
  result:
    name: Build result
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
