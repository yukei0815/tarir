name: Update flake.lock

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: yukei0815/lix-quick-install-action@v6

      - name: Update flake.lock
        run: |
          git config user.name 'tsubomi-kido[bot]'
          git config user.email '342627908+tsubomi-kido[bot]@users.noreply.github.com'
          nix flake update --commit-lock-file
          git log -1 --format='```%n%b```' > "$RUNNER_TEMP/body.md"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/flake-lock
          title: "flake.lock: Update"
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Otherwise update-packages is triggered by the lock PR merging or failing to build
      - name: Update packages without a lock bump
        if: steps.pr.outputs.pull-request-operation != 'created' && steps.pr.outputs.pull-request-operation != 'updated'
        run: gh workflow run update-packages.yml
        env:
          GH_TOKEN: ${{ github.token }}
